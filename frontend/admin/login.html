<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — WishDora</title>
<link rel="stylesheet" href="../admin/theme.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

<div class="login-wrap">
  <form class="glass login-card" id="loginForm" novalidate>
    <div class="login-eyebrow">WishDora Admin</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage cards, categories, and scheduled wishes.</p>

    <div class="login-form">
      <div>
        <label class="label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="admin@wishdora.com" required autocomplete="username" />
      </div>
      <div>
        <label class="label" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div class="login-error" id="loginError" role="alert"></div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
    </div>
  </form>
</div>

<script src="../js/admin/config.js"></script>
<script src="../js/admin/auth.js"></script>
</body>
</html>
